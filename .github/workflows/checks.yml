name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-relay.txt
      - run: bash scripts/check.sh
      - name: Package Omarchy archive and verify checksum
        run: |
          bash scripts/package-omarchy-release.sh HEAD 0.1.0-alpha.1 "$RUNNER_TEMP/PacemanOmarchyRelease"
          cd "$RUNNER_TEMP/PacemanOmarchyRelease"
          shasum -a 256 -c Paceman-Omarchy-0.1.0-alpha.1.tar.gz.sha256

  mac-and-ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Mac panel state transitions
        run: python -m unittest tests.test_mac_panel -v
      - name: Build Mac app and background helper
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from macos import install

          install.signing_identity = lambda: None
          with TemporaryDirectory() as directory:
              install.build_app(Path(directory) / "Paceman.app")
          PY
      - name: Package Omarchy archive and verify checksum
        run: |
          bash scripts/package-omarchy-release.sh HEAD 0.1.0-alpha.1 "$RUNNER_TEMP/PacemanOmarchyRelease"
          cd "$RUNNER_TEMP/PacemanOmarchyRelease"
          shasum -a 256 -c Paceman-Omarchy-0.1.0-alpha.1.tar.gz.sha256
      - name: Dry-run Mac release package
        run: |
          python scripts/package-macos-release.py \
            --release-label 0.1.0-alpha.1 --build-number 1 \
            --output-dir "$RUNNER_TEMP/PacemanMacRelease" --adhoc
      - name: Test iPhone app and extensions
        id: ios_tests
        run: |
          simulator_id=$(xcrun simctl list -j devices available | python -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [device["udid"] for runtime in devices.values() for device in runtime
                    if device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          print(phones[0])
          ')
          # Preserve test failures without waiting for simulator sysdiagnose collection.
          test_status=0
          xcodebuild -project ios/AgentCompanion.xcodeproj -scheme AgentCompanion \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/PacemanDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/AgentCompanion.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test || test_status=$?
          if (( test_status != 0 )); then
            echo "::group::iOS test failure details"
            python scripts/report-xcresult.py "$RUNNER_TEMP/AgentCompanion.xcresult" || \
              echo "Could not summarize test results; inspect the uploaded xcresult."
            echo "::endgroup::"
          fi
          exit "$test_status"
      - name: Preserve failed iOS test results
        if: ${{ failure() && steps.ios_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: AgentCompanion.xcresult
          path: ${{ runner.temp }}/AgentCompanion.xcresult
          retention-days: 7
